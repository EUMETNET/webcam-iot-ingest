global:
  resolve_timeout: 5m
  smtp_smarthost: smtp.gmail.com:465
  smtp_from: tpdeeplearning@gmail.com
  smtp_auth_username: tpdeeplearning@gmail.com
  smtp_auth_password_file: /run/secrets/smtp_password
  smtp_require_tls: true

route:
  receiver: pilot-email
  group_by:
    - alertname
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: pilot-email
    email_configs:
      - to: pierre.lepetit@gmail.com
        send_resolved: true
