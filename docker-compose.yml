name: iot-webcam-ingest

services:
  postgres:
    image: postgres:16.9-bookworm
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-webcam_ingestion}
      POSTGRES_USER: ${DATABASE_USER:-webcam_ingestion}
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema/001_pilot_schema.sql:/docker-entrypoint-initdb.d/001_pilot_schema.sql:ro
      - ./database/schema/002_publication_outbox.sql:/docker-entrypoint-initdb.d/002_publication_outbox.sql:ro
      - ./database/schema/003_adaptive_polling.sql:/docker-entrypoint-initdb.d/003_adaptive_polling.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8011:8001"
    network_mode: ""
    environment:
      - MQTT_HOST=${MQTT_HOST:-mqtt}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_TLS=${MQTT_TLS:-False}
      - MQTT_PROTOCOL_VERSION=${MQTT_PROTOCOL_VERSION:-5}
      - MQTT_TOPIC_PREPEND=${MQTT_TOPIC_PREPEND}
      - INGEST_LOGLEVEL
      - BUCKET_NAME=${BUCKET_NAME}
      - BUCKET_ACCESS_KEY_ID=${BUCKET_ACCESS_KEY_ID}
      - BUCKET_SECRET_ACCESS_KEY=${BUCKET_SECRET_ACCESS_KEY}
      - BUCKET_ENDPOINT_URL=${BUCKET_ENDPOINT_URL}
      - BUCKET_OBJECT_URL=${BUCKET_OBJECT_URL}
      - GUNICORN_CMD_ARGS=--bind 0.0.0.0:8001 --workers=4 --access-logfile -
    depends_on:
      mqtt:
        condition: service_healthy

  windy-worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "ingestion.worker", "--network", "win"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-webcam_ingestion}
      DATABASE_USER: ${DATABASE_USER:-webcam_ingestion}
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      WINDY_API_KEY_FILE: /run/secrets/windy_api_key
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_TLS: "false"
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-webcam}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_BUCKET: ${S3_BUCKET}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE}
      S3_REGION: ${S3_REGION:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      INGESTION_HEALTH_HOST: 0.0.0.0
      INGESTION_HEALTH_PORT: 8002
      MINIMUM_INGESTION_INTERVAL_S: ${MINIMUM_INGESTION_INTERVAL_S:-300}
      POLLING_INTERVAL_FACTOR: ${POLLING_INTERVAL_FACTOR:-0.7}
      MAXIMUM_POLL_INTERVAL_S: ${MAXIMUM_POLL_INTERVAL_S:-1800}
    secrets:
      - database_password
      - windy_api_key
      - s3_access_key
      - s3_secret_key
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_healthy

  mqtt:
    image: eclipse-mosquitto:2.0.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto:/etc/mosquitto
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mosquitto-exporter:
    profiles: ["monitoring"]
    image: sapcc/mosquitto-exporter
    ports:
      - "9234:9234"
    environment:
      - "BROKER_ENDPOINT=tcp://mqtt:1883"
    restart: unless-stopped
    depends_on:
      - mqtt

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana-oss:11.2.0
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:rw
      - ./grafana/dashboards:/var/lib/grafana/dashboards:rw
    depends_on:
      - prometheus

volumes:
  postgres-data:
  grafana-storage:
  prometheus-data:

secrets:
  database_password:
    file: ./.secrets/database_password
  windy_api_key:
    file: ./.secrets/windy_api_key
  s3_access_key:
    file: ./.secrets/s3_access_key
  s3_secret_key:
    file: ./.secrets/s3_secret_key
