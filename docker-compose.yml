name: iot-webcam-ingest

services:
  postgres:
    image: postgres:16.9-bookworm
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-webcam_ingestion}
      POSTGRES_USER: ${DATABASE_USER:-webcam_ingestion}
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema/001_pilot_schema.sql:/docker-entrypoint-initdb.d/001_pilot_schema.sql:ro
      - ./database/schema/005_remove_publication_outbox.sql:/docker-entrypoint-initdb.d/005_remove_publication_outbox.sql:ro
      - ./database/schema/006_simplify_ingestion_state.sql:/docker-entrypoint-initdb.d/006_simplify_ingestion_state.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  schema-migrate:
    image: postgres:16.9-bookworm
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${DATABASE_NAME:-webcam_ingestion}
      PGUSER: ${DATABASE_USER:-webcam_ingestion}
    secrets:
      - database_password
    volumes:
      - ./database/schema/005_remove_publication_outbox.sql:/migrations/005_remove_publication_outbox.sql:ro
      - ./database/schema/006_simplify_ingestion_state.sql:/migrations/006_simplify_ingestion_state.sql:ro
    command:
      - bash
      - -euc
      - |
        export PGPASSWORD="$$(cat /run/secrets/database_password)"
        psql --set=ON_ERROR_STOP=1 --file=/migrations/005_remove_publication_outbox.sql
        psql --set=ON_ERROR_STOP=1 --file=/migrations/006_simplify_ingestion_state.sql
    depends_on:
      postgres:
        condition: service_healthy

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8011:8001"
    network_mode: ""
    environment:
      - MQTT_HOST=${MQTT_HOST:-mqtt}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_TLS=${MQTT_TLS:-False}
      - MQTT_PROTOCOL_VERSION=${MQTT_PROTOCOL_VERSION:-5}
      - MQTT_TOPIC_PREPEND=${MQTT_TOPIC_PREPEND}
      - INGEST_LOGLEVEL
      - BUCKET_NAME=${BUCKET_NAME}
      - BUCKET_ACCESS_KEY_ID=${BUCKET_ACCESS_KEY_ID:-}
      - BUCKET_SECRET_ACCESS_KEY=${BUCKET_SECRET_ACCESS_KEY:-}
      - BUCKET_ENDPOINT_URL=${BUCKET_ENDPOINT_URL}
      - BUCKET_OBJECT_URL=${BUCKET_OBJECT_URL}
      - GUNICORN_CMD_ARGS=--bind 0.0.0.0:8001 --workers=4 --access-logfile -
    depends_on:
      mqtt:
        condition: service_healthy

  windy-worker:
    profiles: ["application"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "ingestion.worker", "--network", "win"]
    env_file:
      - .env
    restart: unless-stopped
    stop_grace_period: ${INGESTION_SHUTDOWN_GRACE_S:-65}s
    cpus: ${WINDY_CPU_LIMIT:-4.0}
    mem_limit: ${WINDY_MEMORY_LIMIT:-2g}
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-webcam_ingestion}
      DATABASE_USER: ${DATABASE_USER:-webcam_ingestion}
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      WINDY_API_KEY_FILE: /run/secrets/windy_api_key
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_TLS: "false"
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-webcam}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_BUCKET: ${S3_BUCKET}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE}
      S3_REGION: ${S3_REGION:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      INGESTION_HEALTH_HOST: 0.0.0.0
      INGESTION_HEALTH_PORT: 8002
      MINIMUM_INGESTION_INTERVAL_S: ${MINIMUM_INGESTION_INTERVAL_S:-300}
      POLLING_INTERVAL_FACTOR: ${POLLING_INTERVAL_FACTOR:-0.7}
      MAXIMUM_POLL_INTERVAL_S: ${MAXIMUM_POLL_INTERVAL_S:-1800}
      INGESTION_WORKER_THREADS: ${WINDY_WORKER_THREADS:-60}
      INGESTION_DATABASE_POOL_SIZE: ${WINDY_DATABASE_POOL_SIZE:-24}
      INGESTION_MAX_JOBS_PER_EPOCH: ${INGESTION_MAX_JOBS_PER_EPOCH:-30000}
    secrets:
      - database_password
      - windy_api_key
      - s3_access_key
      - s3_secret_key
    depends_on:
      schema-migrate:
        condition: service_completed_successfully
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  fintraffic-worker:
    profiles: ["application"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "ingestion.fintraffic.worker"]
    env_file:
      - .env
    restart: unless-stopped
    stop_grace_period: ${INGESTION_SHUTDOWN_GRACE_S:-65}s
    cpus: ${FINTRAFFIC_CPU_LIMIT:-2.0}
    mem_limit: ${FINTRAFFIC_MEMORY_LIMIT:-1g}
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-webcam_ingestion}
      DATABASE_USER: ${DATABASE_USER:-webcam_ingestion}
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      FINTRAFFIC_USER_HEADER: ${FINTRAFFIC_USER_HEADER:-webcam-iot-ingest}
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_TLS: "false"
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-webcam}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_BUCKET: ${S3_BUCKET}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE}
      S3_REGION: ${S3_REGION:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      INGESTION_HEALTH_HOST: 0.0.0.0
      INGESTION_HEALTH_PORT: 8003
      INGESTION_WORKER_THREADS: ${FINTRAFFIC_WORKER_THREADS:-20}
      INGESTION_DATABASE_POOL_SIZE: ${FINTRAFFIC_DATABASE_POOL_SIZE:-8}
      INGESTION_MAX_JOBS_PER_EPOCH: ${INGESTION_MAX_JOBS_PER_EPOCH:-30000}
    secrets:
      - database_password
      - s3_access_key
      - s3_secret_key
    depends_on:
      schema-migrate:
        condition: service_completed_successfully
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  skaping-worker:
    profiles: ["application"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "ingestion.skaping.worker"]
    env_file:
      - .env
    restart: unless-stopped
    stop_grace_period: ${INGESTION_SHUTDOWN_GRACE_S:-65}s
    cpus: ${SKAPING_CPU_LIMIT:-1.0}
    mem_limit: ${SKAPING_MEMORY_LIMIT:-512m}
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-webcam_ingestion}
      DATABASE_USER: ${DATABASE_USER:-webcam_ingestion}
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      SKAPING_API_KEY_FILE: /run/secrets/skaping_api_key
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_TLS: "false"
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-webcam}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_BUCKET: ${S3_BUCKET}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE}
      S3_REGION: ${S3_REGION:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      INGESTION_HEALTH_HOST: 0.0.0.0
      INGESTION_HEALTH_PORT: 8004
      INGESTION_WORKER_THREADS: ${SKAPING_WORKER_THREADS:-4}
      INGESTION_DATABASE_POOL_SIZE: ${SKAPING_DATABASE_POOL_SIZE:-4}
      INGESTION_MAX_JOBS_PER_EPOCH: ${INGESTION_MAX_JOBS_PER_EPOCH:-30000}
    secrets:
      - database_password
      - skaping_api_key
      - s3_access_key
      - s3_secret_key
    depends_on:
      schema-migrate:
        condition: service_completed_successfully
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  webcam-job:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-webcam_ingestion}
      DATABASE_USER: ${DATABASE_USER:-webcam_ingestion}
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      WINDY_API_KEY_FILE: /run/secrets/windy_api_key
      SKAPING_API_KEY_FILE: /run/secrets/skaping_api_key
      FINTRAFFIC_USER_HEADER: ${FINTRAFFIC_USER_HEADER:-webcam-iot-ingest}
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_TLS: "false"
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-webcam}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_BUCKET: ${S3_BUCKET}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE}
      S3_REGION: ${S3_REGION:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      DISCOVERY_METRICS_GATEWAY_URL: http://pushgateway:9091
      BATCH_METRICS_GATEWAY_URL: http://pushgateway:9091
    secrets:
      - database_password
      - windy_api_key
      - skaping_api_key
      - s3_access_key
      - s3_secret_key
    depends_on:
      schema-migrate:
        condition: service_completed_successfully
      mqtt:
        condition: service_healthy

  mqtt:
    image: eclipse-mosquitto:2.0.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto:/etc/mosquitto
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mosquitto-exporter:
    profiles: ["monitoring"]
    image: sapcc/mosquitto-exporter
    ports:
      - "9234:9234"
    environment:
      - "BROKER_ENDPOINT=tcp://mqtt:1883"
    restart: unless-stopped
    depends_on:
      - mqtt

  postgres-exporter:
    profiles: ["monitoring"]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
    # Compose secrets are bind-mounted with the source file's 0600 mode.
    # Root is used only so the exporter can read that file without duplicating
    # the database password into a less restricted credential.
    user: "0:0"
    environment:
      DATA_SOURCE_URI: postgres:5432/${DATABASE_NAME:-webcam_ingestion}?sslmode=disable
      DATA_SOURCE_USER: ${DATABASE_USER:-webcam_ingestion}
      DATA_SOURCE_PASS_FILE: /run/secrets/database_password
    secrets:
      - database_password
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  node-exporter:
    profiles: ["monitoring"]
    image: quay.io/prometheus/node-exporter:v1.11.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    restart: unless-stopped

  cadvisor:
    profiles: ["monitoring"]
    image: ghcr.io/google/cadvisor:v0.57.0
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.13.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pushgateway
      - postgres-exporter
      - node-exporter
      - cadvisor

  pushgateway:
    profiles: ["monitoring"]
    image: prom/pushgateway:v1.11.3
    command:
      - --persistence.file=/data/metrics
      - --persistence.interval=1m
    ports:
      - "127.0.0.1:9091:9091"
    volumes:
      - pushgateway-data:/data
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana-oss:11.2.0
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:rw
      - ./grafana/dashboards:/var/lib/grafana/dashboards:rw
    depends_on:
      - prometheus

volumes:
  postgres-data:
  grafana-storage:
  prometheus-data:
  pushgateway-data:

secrets:
  database_password:
    file: ./.secrets/database_password
  windy_api_key:
    file: ./.secrets/windy_api_key
  skaping_api_key:
    file: ./.secrets/skaping_api_key
  s3_access_key:
    file: ./.secrets/s3_access_key
  s3_secret_key:
    file: ./.secrets/s3_secret_key
